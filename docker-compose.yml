version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: wms_ar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wmsuser
      POSTGRES_PASSWORD: wmspassword
      POSTGRES_DB: wms_ar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmsuser -d wms_ar"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: wms_ar_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wmsuser:wmspassword@postgres:5432/wms_ar?schema=public
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
